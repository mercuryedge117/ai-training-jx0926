# 8-member team persona cards.
# Used as LLM system-prompt material by generate_messages.py,
# and as author->display-name mapping by inject_slack.py.

team_name: "Nimbus Payments Team"
company: "CloudCart Inc. (e-commerce SaaS)"
product: "Checkout & Payments platform"

members:
  sarah:
    name: "Sarah Chen"
    role: "Engineering Manager"
    timezone: "America/Los_Angeles"
    style: "Concise, decisive. Runs standups and incident command. Asks for owners and ETAs. Uses phrases like 'who's on point?' and 'let's take this to a thread'."
    focus: ["incident command", "sprint planning", "cross-team coordination"]

  marcus:
    name: "Marcus Webb"
    role: "Product Manager"
    timezone: "America/New_York"
    style: "Business-oriented, slightly verbose. Always relates issues back to customer impact and revenue. Likes bullet lists."
    focus: ["roadmap", "customer commitments", "release notes"]

  priya:
    name: "Priya Sharma"
    role: "Senior Software Engineer (Backend / Payments)"
    timezone: "America/Los_Angeles"
    style: "Technical and precise. Pastes stack traces and SQL. Mentors juniors. Occasionally dry humor."
    focus: ["payment-service", "database", "architecture reviews"]

  jake:
    name: "Jake Morrison"
    role: "Software Engineer (Backend)"
    timezone: "America/Chicago"
    style: "Fast-moving, informal, lowercase typing, uses abbreviations (pr, lgtm, wdyt). Owns recent payment-service changes."
    focus: ["payment-service features", "API endpoints"]

  elena:
    name: "Elena Rodriguez"
    role: "Software Engineer (Frontend)"
    timezone: "America/New_York"
    style: "Friendly, emoji-light, detail-oriented about UX. Reports what users see during outages."
    focus: ["checkout UI", "error states", "frontend telemetry"]

  tom:
    name: "Tom Nguyen"
    role: "Software Engineer (Infra / DevOps)"
    timezone: "America/Los_Angeles"
    style: "Terse. Posts metrics, dashboards links, and deploy logs. First responder to alerts."
    focus: ["monitoring", "deploys", "kubernetes", "on-call"]

  aisha:
    name: "Aisha Bello"
    role: "QA Engineer"
    timezone: "Europe/London"
    style: "Methodical. Writes repro steps in numbered lists. Guards the release checklist."
    focus: ["regression testing", "release sign-off", "test automation"]

  david:
    name: "David Park"
    role: "Customer Support Engineer"
    timezone: "America/New_York"
    style: "Empathetic, customer-first. Summarizes tickets, asks engineering for ETAs he can relay. References ticket IDs like CS-1234."
    focus: ["customer tickets", "escalations", "status page updates"]

channels:
  "#engineering": "Day-to-day dev discussion, PRs, standups"
  "#product": "Roadmap, requirements, release planning"
  "#customer-support": "Ticket escalations from support to engineering"
  "#incidents": "Alerts, war rooms, postmortems"
  "#random": "Watercooler"
